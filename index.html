<html lang="pt-BR">

<script>try{var _t=localStorage.getItem("oa_theme")||"auto";if(_t==="light")_t="mata";if(_t==="dark")_t="noite";if(_t==="auto")_t=matchMedia("(prefers-color-scheme: dark)").matches?"noite":"mata";document.documentElement.dataset.pal=_t;document.documentElement.dataset.theme=/^(noite|noiteazul|breu)$/.test(_t)?"dark":"light";}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== Organiza Aí, Editais — base herdada do G3, identidade nova (berimbau: verga, cabaça e arame) ===== */
:root{
  --bg:#F2F6F3;--sf:#FFFFFF;--sf2:#EAF1EC;--sf3:#DCE7E0;--line:#D3E0D8;--ink:#11251D;--soft:#45594F;--faint:#6F857B;
  --mata:#0E6B57;--mata2:#0A5444;--matatx:#FFFFFF;--ouro:#F4B630;--ourotx:#3B2600;--madeira:#9A5520;--cabaca:#6E3510;
  --red:#C2362C;--redbg:#FCE6E3;--grn:#157F4E;--grnbg:#DDF3E6;--org:#B85F00;--orgbg:#FFEBD2;--blue:#1F5BC0;--bluebg:#E1EBFF;
  --link:#0B6E59;--topbg:rgba(242,246,243,.94);--navbg:rgba(255,255,255,.97);
  --hero:linear-gradient(150deg,#0F7560 0%,#0A4D3F 58%,#073A30 100%);--herotx:#F3FBF7;--herosoft:#BFE3D5;
  --sh:0 1px 2px rgba(15,50,40,.06),0 4px 14px rgba(15,50,40,.05);
  --disp:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;--body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light}
:root[data-theme="dark"]{
  --bg:#0A1512;--sf:#12211C;--sf2:#192C25;--sf3:#223A31;--line:#2B463B;--ink:#EEF6F2;--soft:#B5C9C0;--faint:#88A097;
  --mata:#3FC59B;--mata2:#2EA882;--matatx:#062A20;--ouro:#F6C04A;--ourotx:#2E1E00;--madeira:#D08A4B;--cabaca:#E0A060;
  --red:#FF8A80;--redbg:rgba(255,110,100,.16);--grn:#5BE3A0;--grnbg:rgba(70,220,150,.14);--org:#FFB45C;--orgbg:rgba(255,160,60,.15);--blue:#8DB8FF;--bluebg:rgba(110,160,255,.16);
  --link:#7FE0C0;--topbg:rgba(10,21,18,.94);--navbg:rgba(14,26,22,.98);
  --hero:linear-gradient(150deg,#12382E 0%,#0C2721 60%,#091D18 100%);--herotx:#F3FBF7;--herosoft:#A9CFC1;
  --sh:none;color-scheme:dark}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.5 var(--body);min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:3px solid var(--ouro);outline-offset:2px}
.hidden{display:none!important}
.app{max-width:760px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--disp);letter-spacing:-.01em}
/* ---------- topo ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;margin:0 -16px;background:var(--topbg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--topbg)}
.pswitch{display:flex;align-items:center;gap:9px;flex:1;min-width:0;background:none;border:0;padding:2px;text-align:left}
.pswitch .pt{min-width:0}.pswitch b{display:block;font:700 1.02rem/1.15 var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pswitch small{display:block;font-size:.76rem;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pav{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;font:800 .95rem var(--disp);color:#fff;background:var(--pc,var(--mata));box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--pc,var(--mata))}
.pav.sm{width:30px;height:30px;font-size:.8rem;box-shadow:none}
.ib{background:var(--sf);border:1px solid var(--line);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--ink)}
.ib .lu{width:20px;height:20px}
.admbar{display:flex;align-items:center;gap:8px;margin:10px 0 0;padding:9px 12px;border-radius:12px;background:var(--bluebg);color:var(--blue);font-size:.84rem;font-weight:700}
.admbar button{margin-left:auto;background:none;border:0;color:inherit;font-weight:800;text-decoration:underline;text-underline-offset:3px;padding:2px}
/* ---------- botões e campos ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 16px;font-weight:800;background:var(--mata);color:var(--matatx);text-decoration:none;min-height:46px}
.btn:active{transform:translateY(1px)}.btn:disabled{opacity:.45}
.btn.gold{background:var(--ouro);color:var(--ourotx)}
.btn.ghost{background:var(--sf);color:var(--ink);border:1.5px solid var(--line)}
.btn.red{background:var(--red);color:#fff}.btn.sm{padding:8px 12px;font-size:.88rem;border-radius:11px;min-height:38px}.btn.full{width:100%}
.link{background:none;border:0;color:var(--link);font-weight:800;padding:6px;text-decoration:underline;text-underline-offset:3px}
.card{background:var(--sf);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--sh)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 0 10px}
.sec h2{font-size:1.15rem;margin:0;font-weight:700}.sec .link{font-size:.86rem;padding:0}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}.muted{color:var(--soft)}.small{font-size:.88rem}.tiny{font-size:.78rem}
.fld{display:block;margin:10px 0}.fld>span{display:block;font-size:.84rem;font-weight:700;color:var(--soft);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;background:var(--sf2);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;outline:none;min-height:46px}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--mata);background:var(--sf)}
.fld textarea{min-height:110px;resize:vertical;line-height:1.5}
.fld .hint{display:block;font-size:.76rem;color:var(--faint);margin-top:4px;font-weight:500}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.two .fld{margin:6px 0}
.seg{display:flex;flex-wrap:wrap;gap:6px}.seg button{border:1.5px solid var(--line);background:var(--sf);border-radius:999px;padding:8px 13px;font-weight:700;font-size:.86rem}
.seg button[aria-pressed="true"]{border-color:var(--mata);background:var(--mata);color:var(--matatx)}
.err{color:var(--red);font-size:.86rem;font-weight:700;min-height:1.2em;margin:8px 0 0}
.empty{color:var(--faint);font-size:.9rem;padding:8px 0}
.emptycard{border:1.5px dashed var(--line);border-radius:16px;padding:18px;text-align:center;color:var(--soft)}
.emptycard .btn{margin-top:10px}
/* ---------- chip de status ---------- */
.st{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-weight:800;font-size:.76rem;white-space:nowrap}
.st.r{background:var(--redbg);color:var(--red)}.st.o{background:var(--orgbg);color:var(--org)}.st.g{background:var(--grnbg);color:var(--grn)}.st.b{background:var(--bluebg);color:var(--blue)}.st.n{background:var(--sf2);color:var(--soft)}
/* ---------- herói: a cabaça (saldo do projeto) ---------- */
.hero{margin-top:16px;border-radius:26px;padding:20px;background:var(--hero);color:var(--herotx);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-40px;width:2px;height:180%;background:linear-gradient(180deg,transparent,rgba(255,240,200,.35),transparent);transform:rotate(28deg);pointer-events:none}
.hero .hk{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.gauge{width:148px;height:148px;position:relative;flex:none}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge .gt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.gauge .gt b{font:800 1.75rem/1 var(--disp)}.gauge .gt span{font-size:.72rem;color:var(--herosoft);margin-top:4px;font-weight:700}
.hero .hv span{display:block;font-size:.8rem;color:var(--herosoft);font-weight:700}
.hero .hv strong{display:block;white-space:nowrap;font:800 clamp(1.45rem,6.4vw,2.3rem)/1.05 var(--disp);letter-spacing:-.02em;margin:2px 0 12px;font-variant-numeric:tabular-nums}
.hero .hv .mini2{display:flex;gap:16px;flex-wrap:wrap}.hero .hv .mini2 div b{display:block;font:700 1.05rem var(--disp);font-variant-numeric:tabular-nums}
.hero .hv .mini2 div small{font-size:.74rem;color:var(--herosoft);font-weight:700}
.hero .neg{color:#FFB4AB!important}
.hero .flow{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14);display:flex;flex-wrap:wrap;gap:6px}
.hero .flow span{background:rgba(255,255,255,.1);border-radius:999px;padding:4px 10px;font-size:.78rem;font-weight:700;color:var(--herotx)}
.hero .flow span i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--c)}
@media (max-width:440px){.hero{padding:18px 16px}.hero .hk{gap:14px}.gauge{width:118px;height:118px}.gauge .gt b{font-size:1.4rem}}
@media (max-width:340px){.hero .hk{grid-template-columns:1fr}.gauge{margin:0 auto}}
/* ---------- ações rápidas ---------- */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.qa{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:12px 4px;font-size:.78rem;font-weight:700;line-height:1.2;box-shadow:var(--sh);color:var(--ink)}
.qa .lu{width:26px;height:26px;color:var(--mata)}.qa.hot{background:var(--ouro);border-color:var(--ouro);color:var(--ourotx)}.qa.hot .lu{color:var(--ourotx)}
/* ---------- listas ---------- */
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px;color:inherit;box-shadow:var(--sh)}
.item .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--sf2);color:var(--mata)}
.item .ico .lu{width:21px;height:21px}
.item b{display:block;line-height:1.3}.item .chev{color:var(--faint)}
.item .val{font:800 1rem var(--disp);font-variant-numeric:tabular-nums;white-space:nowrap}
.item .val.neg{color:var(--red)}
.cdot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--c)}
/* barras */
.bar{height:9px;border-radius:99px;background:var(--sf3);overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:var(--c,var(--mata));transition:width .4s}
.bar.over i{background:var(--red)}
.cat{padding:10px 0;border-bottom:1px solid var(--line)}.cat:last-child{border-bottom:0}
.cat .row{margin-bottom:6px}.cat b{font-size:.92rem}.cat .v{font-weight:800;font-variant-numeric:tabular-nums;font-size:.9rem}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--sh)}
.kpi span{display:block;font-size:.76rem;color:var(--soft);font-weight:700}.kpi b{display:block;font:800 1.2rem var(--disp);margin-top:2px;font-variant-numeric:tabular-nums}
@media (min-width:560px){.kpis{grid-template-columns:repeat(4,1fr)}}
/* metas e objetivos */
.goal{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.goal:last-child{border-bottom:0}
.ck{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);background:var(--sf);display:grid;place-items:center;flex:none;color:#fff;padding:0}
.ck.on{background:var(--grn);border-color:var(--grn)}.ck .lu{width:16px;height:16px;stroke-width:3}
.done{text-decoration:line-through;color:var(--faint)}
.meta{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:8px;box-shadow:var(--sh)}
.meta .mv{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:10px 0 6px}
.meta .mv b{font:800 1.2rem var(--disp);font-variant-numeric:tabular-nums}
.step{display:flex;gap:6px;margin-top:10px}.step button{flex:1;min-height:40px;border-radius:11px;border:1.5px solid var(--line);background:var(--sf2);font-weight:800}
.step button .lu{width:18px;height:18px;vertical-align:-.25em}
.tag{display:inline-block;font-size:.72rem;font-weight:800;border-radius:6px;padding:1px 7px;background:var(--sf2);color:var(--soft)}
/* ---------- agenda ---------- */
.calhd{display:flex;align-items:center;gap:10px;margin:16px 0 10px}.calhd h2{flex:1;text-align:center;margin:0;font-size:1.2rem;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal .h{font-size:.72rem;color:var(--faint);text-align:center;font-weight:800;padding-bottom:2px}
.cal button{aspect-ratio:1;border:1.5px solid transparent;background:var(--sf);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:700;font-size:.92rem;padding:0;color:var(--ink)}
.cal button.out{opacity:.35}.cal button.td{border-color:var(--blue)}
.cal button.fer{color:var(--red)}
.cal button.mine{background:var(--orgbg);border-color:var(--ouro);font-weight:900}
.cal button.sel{background:var(--mata);color:var(--matatx);border-color:var(--mata)}
.cal .dots{display:flex;gap:3px;height:6px}.cal .dots i{width:6px;height:6px;border-radius:50%}
.cal .dots i.m{background:var(--madeira)}.cal .dots i.o{background:var(--blue)}.cal button.sel .dots i{background:var(--matatx)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.78rem;color:var(--soft);margin:10px 2px 0;font-weight:600}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.ev{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--sf);border:1px solid var(--line);border-left:6px solid var(--pc,var(--madeira));border-radius:14px;padding:11px 12px;margin-bottom:8px;color:inherit;box-shadow:var(--sh)}
.ev.other{border-left-color:var(--blue)}
.ev .t{font:800 .9rem var(--disp);color:var(--ink);min-width:48px}
/* ---------- fotos ---------- */
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.thumbs .th{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--sf3)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .x{position:absolute;top:5px;right:5px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;padding:0}
.thumbs .x .lu{width:15px;height:15px}
.addph{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--line);border-radius:12px;padding:12px;color:var(--soft);font-weight:700;cursor:pointer}
.recibo{width:100%;max-height:340px;object-fit:contain;border-radius:14px;background:var(--sf2);border:1px solid var(--line)}
.scan{background:linear-gradient(135deg,var(--ouro),#F7CB61);color:var(--ourotx);border-radius:20px;padding:16px;display:flex;align-items:center;gap:14px;border:0;width:100%;text-align:left;margin-top:14px}
.scan .lu{width:34px;height:34px;flex:none}.scan b{display:block;font:800 1.08rem var(--disp)}.scan span{font-size:.84rem;font-weight:600}
.prog{height:8px;border-radius:99px;background:var(--sf3);overflow:hidden;margin:12px 0}.prog i{display:block;height:100%;width:5%;background:var(--mata);transition:width .3s}
/* ---------- navegação inferior ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--navbg);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.nav .in{max-width:760px;margin:0 auto;display:grid;gap:0}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;font-weight:700;color:var(--faint);padding:5px 0;border-radius:12px}
.nav button .lu{width:25px;height:25px;stroke-width:1.9}
.nav button[aria-current="true"]{color:var(--mata)}.nav button[aria-current="true"] .lu{stroke-width:2.4}
.fab{position:fixed;right:18px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:30;width:58px;height:58px;border-radius:18px;border:0;display:grid;place-items:center;background:var(--ouro);color:var(--ourotx);box-shadow:0 10px 24px rgba(0,0,0,.25)}
.fab .lu{width:28px;height:28px;stroke-width:2.4}
@media (min-width:900px){.fab{right:calc(50% - 470px)}}
/* ---------- folha (modal) ---------- */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(5,20,15,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--sf);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:16px 16px calc(22px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@media (min-width:700px){.sheet{align-items:center}.sheet .in{border-radius:24px;max-height:88vh}}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
@media (prefers-reduced-motion:reduce){.sheet .in{animation:none}.bar i{transition:none}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-size:1.3rem;margin:0 0 4px}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.det{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:.92rem;margin:12px 0}.det dt{color:var(--soft);font-weight:700}.det dd{margin:0;font-weight:600;overflow-wrap:anywhere}
/* ---------- entrada ---------- */
.auth{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:calc(28px + env(safe-area-inset-top,0px)) 18px 30px;background:radial-gradient(120% 70% at 50% 0%,rgba(244,182,48,.22),transparent 60%),var(--bg)}
.auth .box{width:100%;max-width:440px}
.brand{text-align:center}.brand img{width:108px;height:108px;border-radius:26px;box-shadow:0 12px 30px rgba(10,60,45,.25)}
.brand h1{font-size:2rem;line-height:1.05;margin:14px 0 4px;font-weight:800}
.brand p{margin:0 0 18px;color:var(--soft)}
.recent{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}.recent button{border:1px solid var(--line);background:var(--sf2);border-radius:999px;padding:5px 11px;font-size:.8rem;font-weight:700}
.demo{background:var(--orgbg);color:var(--org);font-weight:700;border-radius:12px;padding:10px 12px;font-size:.82rem;margin-top:12px}
/* ---------- avisos ---------- */
.toasts{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--ink);color:var(--bg);border-radius:14px;padding:11px 13px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:up .25s}
.toast .lu{width:22px;height:22px;flex:none;color:var(--ouro)}.toast b{display:block}.toast span{font-size:.84rem;opacity:.85}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:11px 13px;font-size:.88rem;font-weight:600;margin-top:10px}
.alert .lu{width:20px;height:20px;flex:none;margin-top:1px}

.search{width:100%;background:var(--sf);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;min-height:46px}

.foot{text-align:center;color:var(--faint);font-size:.82rem;margin:34px 0 6px}.foot b{color:var(--soft)}

/* ===== versão 1.4: metas automáticas, ações repetidas e relato por voz ===== */
.modos{display:grid;gap:8px}.modos button{display:block;text-align:left;border:1.5px solid var(--line);background:var(--sf);border-radius:14px;padding:10px 12px;color:var(--ink)}

.rep{background:var(--sf2);border-radius:14px;padding:4px 12px 12px;margin-top:4px}
.voz{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.mic{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:10px 16px;font-weight:800;background:var(--ouro);color:var(--ourotx);min-height:44px}

.passos{display:grid;gap:10px;margin-top:12px}.passos>div{display:flex;gap:12px;align-items:flex-start}

.cmds{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.cmds span{background:var(--sf2);border-radius:999px;padding:4px 10px;font-size:.84rem}

.revis{background:var(--sf2);border-radius:12px;padding:8px 10px;margin:-4px 0 10px}.revis .link{padding:0 4px}

.alert span,.alert small{overflow-wrap:anywhere;word-break:break-word;min-width:0}.sheet .in{overflow-x:hidden}

@keyframes chacoalha{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* ---------- cores da agenda: cada projeto cultural com a sua ---------- */
function corMapa(E,p){const base=coresDaCidade(p),m={},used=new Set();Object.values(base).forEach(x=>used.add(x.cor));Object.assign(m,base);
  E.forEach(e=>{if(m[e.projeto])return;let c=e.projetoCor||corDe(e.projeto);if(used.has(c))c=CORES.find(k=>!used.has(k))||c;used.add(c);m[e.projeto]={cor:c,nome:e.projetoNome};});return m;}
function coresDaCidade(p){const ids={};D.eventos.filter(e=>e.cidadeKey===p.cidadeKey).forEach(e=>{const x=ids[e.projeto]=ids[e.projeto]||{id:e.projeto,cor:e.projetoCor,nome:e.projetoNome,t:Infinity};x.t=Math.min(x.t,e.criado||Infinity);});
  ids[p.id]=Object.assign(ids[p.id]||{t:Infinity},{id:p.id,cor:corProj(p),nome:p.nome});
  /* mesma ordem para todos os usuários: quem marcou ação primeiro fica com a cor que escolheu */
  const L=Object.values(ids).sort((a,b)=>a.t-b.t||a.id.localeCompare(b.id));
  const used=new Set(),m={};L.forEach(x=>{let c=x.cor||corDe(x.id);if(used.has(c))c=CORES.find(k=>!used.has(k))||c;used.add(c);m[x.id]={cor:c,nome:x.nome};});return m;}
function evItem(e,cm){const p=P(),mine=p&&e.projeto===p.id,c=((cm||coresDaCidade(p))[e.projeto]||{}).cor||e.projetoCor||corDe(e.projeto);
  return `<button class="ev" data-e="${e.id}" style="--pc:${c}"><span class="t">${e.hi||"Dia todo"}</span><span class="grow"><b>${esc(e.titulo)}${e.serie?` <span class="muted" title="Ação repetida">${ic("repeat")}</span>`:""}</b><span class="tiny muted" style="display:block">${flong(e.data)}${e.local?" · "+esc(e.local):""}</span><span class="pj"><i></i>${mine?"Seu projeto":esc(e.projetoNome||"outro projeto")}</span></span></button>`;}

function gcal(e){const d=e.data.replace(/-/g,"");let dates;if(e.hi){const hf=e.hf||((+e.hi.slice(0,2)+1)%24+"").padStart(2,"0")+e.hi.slice(2);dates=d+"T"+e.hi.replace(":","")+"00/"+d+"T"+hf.replace(":","")+"00";}else dates=d+"/"+addDays(e.data,1).replace(/-/g,"");

function imgFromBlob(b){return new Promise((ok,no)=>{const u=URL.createObjectURL(b),im=new Image();im.onload=()=>{ok(im);setTimeout(()=>URL.revokeObjectURL(u),1000);};im.onerror=()=>no(new Error("imagem"));im.src=u;});}
function canvasDe(src,max){const w=src.naturalWidth||src.width,h=src.naturalHeight||src.height,s=Math.min(1,max/Math.max(w,h)),c=document.createElement("canvas");c.width=Math.round(w*s);c.height=Math.round(h*s);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(src,0,0,c.width,c.height);return c;}
function jpeg(c,limite){let q=.78,u=c.toDataURL("image/jpeg",q);while(u.length>limite&&q>.35){q-=.1;u=c.toDataURL("image/jpeg",q);}if(u.length>limite){const c2=canvasDe(c,Math.round(Math.max(c.width,c.height)*.7));return jpeg(c2,limite);}return u;}
async function pdfPagina1(file){await loadLib(U_PDFJS);pdfjsLib.GlobalWorkerOptions.workerSrc=U_PDFW;const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let texto="";
  for(let n=1;n<=Math.min(2,pdf.numPages);n++){const pg=await pdf.getPage(n),tc=await pg.getTextContent(),lines=[];
    tc.items.filter(i=>i.str&&i.str.trim()).forEach(i=>{const y=i.transform[5];let L=lines.find(l=>Math.abs(l.y-y)<=(i.height||8)*.5);if(!L){L={y,t:[]};lines.push(L);}L.t.push({x:i.transform[4],s:i.str});});
    texto+=lines.sort((a,b)=>b.y-a.y).map(L=>L.t.sort((a,b)=>a.x-b.x).map(t=>t.s).join(" ")).join("\n")+"\n";}
  const pg=await pdf.getPage(1),v0=pg.getViewport({scale:1}),vp=pg.getViewport({scale:Math.min(3,1500/v0.width)}),cv=document.createElement("canvas");cv.width=vp.width;cv.height=vp.height;
  const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);await pg.render({canvasContext:cx,viewport:vp}).promise;return{texto,canvas:cv};}
async function arquivoParaImagem(f){if(/pdf/i.test(f.type)||/\.pdf$/i.test(f.name||"")){const r=await pdfPagina1(f);return{img:jpeg(canvasDe(r.canvas,1400),650000),texto:r.texto,canvas:r.canvas};}
  const im=await imgFromBlob(f);return{img:jpeg(canvasDe(im,1400),650000),canvas:canvasDe(im,1800)};}
async function ocr(cv,prog){await loadLib(U_TESS);let w=null;try{w=await comTempo(Tesseract.createWorker("por",1,{logger:m=>{if(m.status==="recognizing text")prog("Lendo o texto…",.3+m.progress*.7);else if(/load|init/.test(m.status||""))prog("Preparando a leitura…",.15);}}),60000);
  const {data}=await comTempo(w.recognize(cv),120000);return data.text||"";}finally{if(w)try{w.terminate();}catch(e){}}}

const MABR=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
function adivinhaCat(t){const n=nrm(t);const R0=[["acess",/libras|interprete|acessib|audiodescri|legenda/],["foto",/foto|fotograf|filmag|video|audiovisual|drone/],["instr",/berimbau|atabaque|pandeiro|caxixi|agogo|reco reco|instrumento|verga|cabaca|arame/],
  ["unif",/abada|cordao|cordoes|uniforme|camis|figurino|malha|costur|confec/],["divul",/grafica|banner|panfleto|cartaz|impress|divulg|anuncio|impulsion|adesivo|flyer/],["alim",/restaurante|lanche|aliment|refeic|supermerc|mercadinho|padaria|agua mineral|buffet|cafe da manha/],
  ["transp",/\buber\b|transporte|passage|onibus|combustiv|\bposto\b|gasolina|\bhotel|hosped|pousada|fretamento|\bvan\b/],["loc",/aluguel|locacao|sonoriza|palco|tenda|cadeiras|espaco|som e luz|iluminac/],
  ["cache",/mestre|cache|oficineiro|instrutor|contramestre|professor|palestr|apresentac|artista/],["prod",/produc|coorden|assessor|contab|elaboracao|gestao/],["taxas",/imposto|\biss\b|\binss\b|\bdarf\b|cartorio|\bguia\b/]];
  const h=R0.find(([,rx])=>rx.test(n));return h?h[0]:"outros";}
function interpretaComprovante(txt){const lines=String(txt||"").split(/\r?\n/).map(s=>s.replace(/[|]/g," ").replace(/\s+/g," ").trim()).filter(Boolean),N=lines.map(nrm),out={};
  /* valor: prioriza linhas com "valor", "total", "pago"; ignora saldo, tarifa, limite */
  const AM=/(?:R\s?\$\s*)?(\d{1,3}(?:[.\s]\d{3})*,\s?\d{2}|\d+,\s?\d{2})(?!\d)/g;let best=null;
  lines.forEach((L,i)=>{const n=N[i];[...L.matchAll(AM)].forEach(m=>{const v=money(m[1].replace(/\s(?=\d{3})/g,".").replace(/,\s/,","));if(!(v>0)||v>5e6)return;let sc=0;
    if(/R\s?\$/.test(m[0]))sc+=2;if(/\bvalor\b|\btotal\b|\bpago\b|\bquantia\b|\bimporte\b/.test(n))sc+=4;if(i>0&&/\bvalor\b|\btotal\b/.test(N[i-1])&&!/\d/.test(lines[i-1].replace(/R\$/,"")))sc+=3;
    if(/saldo|tarifa|juros|multa|desconto|limite|disponivel|troco/.test(n))sc-=5;if(!best||sc>best.sc||(sc===best.sc&&v>best.v))best={v,sc};});});
  if(best)out.valor=best.v;
  /* data */
  const DRX=/\b(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})\b/,DRX2=/\b(\d{1,2})\s*(?:de\s*)?(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)[a-z]*\.?\s*(?:de\s*)?(\d{4})\b/i;
  const toIso=(d,m,y)=>{y=+y;if(y<100)y+=2000;d=+d;m=+m;if(m<1||m>12||d<1||d>31||y<2015||y>2100)return"";return y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0");};
  const order=[...lines.keys()].sort((a,b)=>(/data|realizad|pago em|efetuad|em \d/.test(N[b])?1:0)-(/data|realizad|pago em|efetuad|em \d/.test(N[a])?1:0));
  for(const i of order){let m=lines[i].match(DRX),r="";if(m)r=toIso(m[1],m[2],m[3]);else{m=nrm(lines[i]).match(DRX2);if(m)r=toIso(m[1],MABR.indexOf(m[2].slice(0,3).toLowerCase())+1,m[3]);}if(r){out.data=r;break;}}
  /* destinatário */
  const KW=/^(destino|destinatario|para|recebedor|favorecido|beneficiario|quem recebeu|pago para|transferido para|enviado para|dados do recebedor|dados do favorecido|dados de quem recebeu|nome do recebedor|nome do favorecido)\b/;
  const ruim=s=>{const n=nrm(s);return !n||n.length<3||/\d{3}/.test(s)||/^(nome|cpf|cnpj|chave|agencia|conta|instituicao|banco|tipo|valor|data|pix|id|documento|origem|pagador|de)\b/.test(n)||!/[a-z]{3}/.test(n);};
  const limpa=s=>tcase(String(s).replace(/^(nome( do (recebedor|favorecido))?|para|destino|favorecido|recebedor|beneficiario)\s*[:\-]?\s*/i,"").replace(/\*{2,}.*$/,"").replace(/[\d.\-\/*]{6,}.*$/,"").trim()).slice(0,70);
  for(let i=0;i<lines.length&&!out.destino;i++){if(!KW.test(N[i]))continue;const after=lines[i].split(/[:\-]\s*/).slice(1).join(" ").trim();
    if(after&&!ruim(after)){out.destino=limpa(after);break;}
    for(let j=i+1;j<Math.min(lines.length,i+5);j++){let L=lines[j];if(/^nome\b/i.test(nrm(L))){const a=L.split(/[:]\s*/).slice(1).join(" ").trim()||L.replace(/^nome\s*/i,"").trim();if(a&&!ruim(a)){out.destino=limpa(a);break;}continue;}if(!ruim(L)){out.destino=limpa(L);break;}}}
  const n=nrm(txt);out.forma=/\bpix\b/.test(n)?"PIX":/\bted\b|\bdoc\b|transferencia/.test(n)?"Transferência":/boleto|codigo de barras/.test(n)?"Boleto":/cartao|debito|credito/.test(n)?"Cartão":"PIX";
  {const di=N.findIndex(n=>/^(descricao|mensagem|finalidade|referente|informacao para o recebedor)\b/.test(n));if(di>=0){const aft=lines[di].split(/:\s*/).slice(1).join(" ").trim()||lines[di+1]||"";if(aft&&!/^(r\s?\$|valor|data|nome)/i.test(aft))out.desc=aft.slice(0,200);}}
  const desc=lines.filter((l,i)=>/^(descricao|mensagem|finalidade|referente|historico|produto|servico|discriminacao)/.test(N[i])).join(" ");out.cat=adivinhaCat((out.destino||"")+" "+desc);if(out.cat==="outros")out.cat=adivinhaCat(String(txt).replace(/mercado ?pago|comprovante|transfer[eê]ncia|pagamento|institui[cç][aã]o/gi," "));if(/nota fiscal|nf e|nfs e/.test(n)){const m=String(txt).match(/n[ºo°.]?\s*(?:da nota|nf)?\s*[:\-]?\s*(\d{3,})/i);if(m)out.doc="NF "+m[1];}
  return out;}

async function excluirProjeto(p){const t=prompt(`Para excluir “${p.nome}” com todos os gastos, ações, relatos e fotos, digite EXCLUIR:`);if(String(t||"").trim().toUpperCase()!=="EXCLUIR")return;
  gastosDe(p.id).forEach(g=>{B.del("gastos",g.id);if(g.temComp)B.del("comprovantes",g.id);});eventosDe(p.id).forEach(e=>B.del("eventos",e.id));
  for(const r of relatosDe(p.id)){try{(await B.query("fotos",[["relato","==",r.id],["dono","==",p.dono]])).forEach(f=>B.del("fotos",f.id));}catch(e){}B.del("relatos",r.id);}
  if(isAdmin())B.del("servicos",p.id);await B.del("projetos",p.id);setPID(null);LOADED.projetos=1;onProjetos();tab({v:homeV()});toast("trash-2","Projeto excluído","");}

async function relatoForm(id,pre,opt){opt=opt||{};const p=P();if(!canEdit(p))return;const r=id?D.relatos.find(x=>x.id===id):Object.assign({titulo:"",data:TODAY(),texto:"",publico:"",evento:""},pre||{});if(!id&&!r.evento){const h=eventosDe(p.id).find(e=>e.data===TODAY()&&!D.relatos.some(x=>x.evento===e.id));if(h){r.evento=h.id;r.titulo=r.titulo||h.titulo;}}

  ${autoM.length?`<div class="fld"><span>Esta ação conta para as metas</span><div class="mck" id="rMt">${autoM.map(m=>`<label><input type="checkbox" value="${m.id}" ${selM.has(m.id)?"checked":""}><span><b>${esc(m.texto)}</b><small>${m.modo==="publico"?"soma o público deste relato":"soma +1 "+esc(m.un||"")}</small></span></label>`).join("")}</div><span class="hint">Ao salvar, as metas marcadas se atualizam sozinhas.</span></div>`:""}
  <div class="fld"><span>Fotos (até 30)</span><div class="thumbs" id="rPh"></div><label class="addph">${ic("camera")} Adicionar fotos<input type="file" id="rF" accept="image/*" multiple hidden></label></div>
  <div class="btns"><button class="btn full" id="rS">${ic("check")} Salvar relato</button></div>`);
  const draw=()=>{const A=antigas.filter(f=>!remover.has(f.id));$("rPh").innerHTML=A.map(f=>`<div class="th"><img src="${f.img}" alt=""><button class="x" data-ra="${f.id}" aria-label="Remover foto">${ic("x")}</button></div>`).join("")+novas.map((u,i)=>`<div class="th"><img src="${u}" alt=""><button class="x" data-rn="${i}" aria-label="Remover foto">${ic("x")}</button></div>`).join("");
    qa("[data-ra]").forEach(b=>b.onclick=()=>{remover.add(b.dataset.ra);draw();});qa("[data-rn]").forEach(b=>b.onclick=()=>{novas.splice(+b.dataset.rn,1);if(typeof novasPh!=="undefined")novasPh.splice(+b.dataset.rn,1);draw();});};draw();
  $("rEv").onchange=()=>{const e=evs.find(x=>x.id===$("rEv").value);if(e){if(!$("rT").value.trim())$("rT").value=e.titulo;$("rD").value=e.data;if(e.meta)qa("#rMt input").forEach(c=>{if(c.value===e.meta)c.checked=true;});}};
  let tPre=null;const agenda=()=>{clearTimeout(tPre);tPre=setTimeout(()=>{if($("rX2")&&$("rT"))preRevisar($("rX2").value,$("rT").value);},1800);};$("rX2").addEventListener("input",agenda);$("rT").addEventListener("input",agenda);if(String(r.texto||"").trim().length>=15&&!(r.revisado))agenda();
  ligarVoz($("rMic"),$("rMicT"),$("rX2"));$("rVozA").onclick=()=>ajudaVoz(false);
  if(opt.voz){setTimeout(()=>{const t=$("rX2");if(t)t.scrollIntoView({block:"center"});const m=$("rMic");if(m&&!(VOZ&&VOZ.ativo))m.click();},350);}

      delete FOTOS[rid];closeSheet();if(novas.length||remover.size)recontarFotos(rid).then(()=>{if(novas.length)estimarPublico(rid);});const mm=autoM.filter(m=>v.metas.includes(m.id));

    let al=0;if(t.saldo<0)al+=3;if(p.prazo&&dias(TODAY(),p.prazo)<=30)al+=2;if(!t.n)al+=1;return{p,t,mp,rel,ac,al};});
  const cidades=[...new Set(D.projetos.map(p=>p.cidade).filter(Boolean))].sort();
  const F=L.filter(x=>(!cf||x.p.cidade===cf)&&(!q||nrm(x.p.nome+" "+x.p.cidade+" "+(x.p.donoEmail||"")+" "+(x.p.edital||"")).includes(nrm(q))))
    .sort(ord==="nome"?(a,b)=>byName(a.p,b.p):ord==="exec"?(a,b)=>b.t.pct-a.t.pct:(a,b)=>b.al-a.al||byName(a.p,b.p));

  on(()=>{$("aQ").oninput=e=>{VIEW.q=e.target.value;VIEW._keep=1;render();VIEW._keep=0;};qa("[data-cid]").forEach(b=>b.onclick=()=>{VIEW.cid=b.dataset.cid;render();});

    $("aX").onclick=()=>pdfPainel(F);});

/* textos longos: divide em partes e revisa todas AO MESMO TEMPO (bem mais rápido) */
function partesTexto(t,alvo){const blocos=t.split(/\n+/).flatMap(p=>p.length<=alvo*1.4?[p]:p.match(/[^.!?]+[.!?]*\s*/g)||[p]);const out=[];let cur="";
  for(const b of blocos){if(cur&&(cur+" "+b).length>alvo){out.push(cur.trim());cur=b;}else cur=cur?cur+(/\n$/.test(cur)?"":" ")+b:b;}if(cur.trim())out.push(cur.trim());return out;}
async function revisarTexto(t,titulo){t=String(t||"").trim();if(t.length<15)return null;if(t.length<=1300)return revisarParte(t,titulo);
  const P=partesTexto(t,800);const R=await Promise.all(P.map((p,k)=>revisarParte(p,k===0?titulo:"").catch(()=>null)));
  if(R.some(x=>!x))return revisarParte(t,titulo);/* se alguma parte falhar, faz tudo de uma vez */

const SRec=window.SpeechRecognition||window.webkitSpeechRecognition;

function pontuaVoz(t){t=" "+t+" ";
  t=t.replace(/\s+(novo parágrafo|nova linha|próxima linha)\s+/gi,"\n").replace(/\s+ponto de interrogação\s*/gi,"? ").replace(/\s+ponto de exclamação\s*/gi,"! ")
     .replace(/\s+ponto final\s*/gi,". ").replace(/\s+dois pontos\s*/gi,": ").replace(/\s+vírgula\s*/gi,", ");
  return t.replace(/[ \t]+/g," ").replace(/ \n/g,"\n").trim();}
function capitaliza(s){return s.replace(/(^|[.!?]\s+|\n)([a-zà-ú])/g,(m,a,b)=>a+b.toUpperCase());}
function pararVoz(){if(VOZ){VOZ.ativo=false;try{VOZ.rec.stop();}catch(e){}}}
function ligarVoz(btn,lbl,ta){if(!btn)return;
  const idle=()=>{try{ta.dispatchEvent(new Event("input"));}catch(e){}btn.classList.remove("on");btn.setAttribute("aria-pressed","false");lbl.textContent="Falar o relato";};
  btn.onclick=()=>{if(!SRec){ajudaVoz(true);return;}
    if(VOZ&&VOZ.ativo){pararVoz();return;}
    let base=ta.value;const st={ativo:true,rec:null};VOZ=st;
    btn.classList.add("on");btn.setAttribute("aria-pressed","true");lbl.textContent="Ouvindo… toque para parar";
    const novo=()=>{const r=new SRec();r.lang="pt-BR";r.continuous=false;r.interimResults=true;r.maxAlternatives=1;st.rec=r;
      r.onresult=ev=>{let fin="",tmp="";for(let i=ev.resultIndex;i<ev.results.length;i++){const x=ev.results[i][0].transcript;if(ev.results[i].isFinal)fin+=x;else tmp+=x;}
        if(fin){base=capitaliza((base&&!/[\s\n]$/.test(base)?base+" ":base)+pontuaVoz(fin));}ta.value=base+(tmp?(base&&!/[\s\n]$/.test(base)?" ":"")+tmp:"");};
      r.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed"){st.ativo=false;toast("mic-off","Microfone bloqueado","Permita o uso do microfone nas configurações do celular.");}
        else if(e.error==="network"){st.ativo=false;toast("wifi-off","Sem internet","O relato por voz precisa de internet.");}};
      r.onend=()=>{if(st.ativo){try{novo();}catch(x){st.ativo=false;idle();}}else{ta.value=base;idle();if(VOZ===st)VOZ=null;}};
      try{r.start();}catch(x){st.ativo=false;idle();}};
    novo();};}

function datasRepeticao(ini,ate,modo,dias){const out=[];if(!ini||!ate||ate<ini)return out;const d0=new Date(ini+"T12:00:00"),fim=new Date(ate+"T12:00:00");
  if(modo==="mes"){const dia=d0.getDate();for(let k=0;k<60;k++){const d=new Date(d0.getFullYear(),d0.getMonth()+k,dia,12);if(d>fim)break;if(d.getDate()===dia)out.push(iso(d));}return out;}
  const ini0=new Date(d0);ini0.setDate(d0.getDate()-d0.getDay());
  for(let d=new Date(d0);d<=fim&&out.length<300;d.setDate(d.getDate()+1)){if(!dias.includes(d.getDay()))continue;const sem=Math.floor((d-ini0)/(7*864e5));if(modo==="qui"&&sem%2)continue;out.push(iso(d));}
  return out;}

/* registro (relato) do dia: o app escolhe ou cria sozinho */
function opcoesDoDia(p,k){const ev=eventosDe(p.id).filter(e=>e.data===k).sort((a,b)=>(a.hi||"").localeCompare(b.hi||"")),RL=relatosDe(p.id).filter(r=>r.data===k);

function dhash(src){const c=document.createElement("canvas");c.width=9;c.height=8;const x=c.getContext("2d");x.drawImage(src,0,0,9,8);const d=x.getImageData(0,0,9,8).data;let b="";
  for(let y=0;y<8;y++)for(let i=0;i<8;i++){const a=(y*9+i)*4,n=a+4;b+=(d[a]+d[a+1]+d[a+2])>(d[n]+d[n+1]+d[n+2])?"1":"0";}return b;}
const hamming=(a,b)=>{if(!a||!b||a.length!==b.length)return 99;let n=0;for(let i=0;i<a.length;i++)if(a[i]!==b[i])n++;return n;};
function qualidade(im){const c=canvasDe(im,256),x=c.getContext("2d"),w=c.width,h=c.height,d=x.getImageData(0,0,w,h).data,g=new Float32Array(w*h);let soma=0;
  for(let i=0,j=0;i<d.length;i+=4,j++){const v=.299*d[i]+.587*d[i+1]+.114*d[i+2];g[j]=v;soma+=v;}
  let s=0,s2=0,n=0;for(let y=1;y<h-1;y++)for(let i=1;i<w-1;i++){const k=y*w+i,L=4*g[k]-g[k-1]-g[k+1]-g[k-w]-g[k+w];s+=L;s2+=L*L;n++;}
  const media=soma/(w*h),vari=n?s2/n-(s/n)*(s/n):999;return{escura:media<52,tremida:vari<38&&media>=52,ph:dhash(im)};}
const _phCache={};
async function hashesDoRegistro(r){if(!r||!r.nFotos)return[];let F=[];try{F=await fotosDe(r);}catch(e){return[];}

  <div class="fld"><span>Quantas cópias (uma por página, até 30)</span><div class="linhas"><button type="button" class="ib" id="tpM" aria-label="Menos">${ic("minus")}</button><b id="tpN">1</b><button type="button" class="ib" id="tpP" aria-label="Mais">${ic("plus")}</button>
   <div class="seg" style="margin-left:6px">${[1,5,10,20].map(k=>`<button type="button" data-tn="${k}" aria-pressed="${k===1}">${k}</button>`).join("")}</div></div></div>
  <label class="row" style="margin:12px 0 0;font-weight:700"><input type="checkbox" id="tpI" checked style="width:22px;height:22px;accent-color:var(--mata)"> Incluir autorização de uso de imagem</label>
  <div class="btns"><button class="btn gold full" id="tpG">${ic("file-text")} Gerar termo em PDF</button></div>`);
  const setN=k=>{n=Math.max(1,Math.min(30,k));$("tpN").textContent=n;qa("[data-tn]").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.tn===n));};
  $("tpM").onclick=()=>setN(n-1);$("tpP").onclick=()=>setN(n+1);qa("[data-tn]").forEach(b=>b.onclick=()=>setN(+b.dataset.tn));
  $("tpE").onchange=()=>{const e=evs.find(x=>x.id===$("tpE").value);if(e&&e.local)$("tpL").value=e.local;};
  $("tpG").onclick=()=>{const e=evs.find(x=>x.id===$("tpE").value);gerarTermoPDF(p,{evento:e||null,local:$("tpL").value.trim(),copias:n,imagem:$("tpI").checked});};}
async function cabecalhoDoc(doc,p,titulo,COR){const W=210,M=12,OURO=[244,182,48],escura=c=>c.map(x=>Math.round(x*.72));const logo=await iconData();
  doc.setFillColor(...COR);doc.rect(0,0,W,40,"F");doc.setFillColor(...escura(COR));doc.circle(W-8,-4,32,"F");doc.setFillColor(...COR);doc.circle(W-8,-4,26,"F");doc.setFillColor(...OURO);doc.rect(0,40,W,1.4,"F");
  if(logo)doc.addImage(logo,"PNG",M,8,24,24);const X=M+29,larg=W-X-M-6,resp=(p.proponente||(p.dono===UID&&ME&&ME.nome)||"").trim().toUpperCase(),proj=String(p.nome||"").toUpperCase();
  const caber=(t,max,min)=>{let z=max;doc.setFontSize(z);while(doc.getTextWidth(t)>larg&&z>min){z-=.25;doc.setFontSize(z);}return z;};
  doc.setFont("helvetica","bold");let zt=caber(titulo,19,13);doc.setFont("helvetica","bold");const zp=caber(proj,12,9);doc.setFont("helvetica","normal");const zr=resp?caber(resp,11.5,9):0;
  doc.setTextColor(255,255,255);doc.setFont("helvetica","bold");doc.setFontSize(zt);doc.text(titulo,X,resp?15.6:18.4);doc.setFontSize(zp);doc.setTextColor(240,248,244);doc.text(doc.splitTextToSize(proj,larg)[0],X,resp?23.4:26.6);
  if(resp){doc.setFont("helvetica","normal");doc.setFontSize(zr);doc.setTextColor(226,240,234);doc.text(resp,X,30.2);}}
async function gerarTermoPDF(p,o){toast("hourglass","Montando o termo…","");let J;try{await loadLib(U_PDF);J=window.jspdf.jsPDF;}catch(e){return toast("wifi-off","Sem internet","Conecte-se uma vez para o app guardar o gerador de PDF.");}
  try{const doc=new J({unit:"mm",format:"a4"}),W=210,H=297,M=14,CW=W-2*M,COR=hexRGB(corProj(p)),TINTA=[24,38,32],CINZA=[105,120,113],LINHA=[190,200,195];
    const resp=(p.proponente||"").trim()||"o(a) responsável pelo projeto",ativ=o.evento?`na atividade “${o.evento.titulo}”, no dia ${dataExtenso(o.evento.data)}${o.evento.hi?", às "+o.evento.hi:""}`:"nas atividades do projeto, durante todo o período de execução";
    for(let c=0;c<o.copias;c++){if(c)doc.addPage();await cabecalhoDoc(doc,p,"TERMO DE AUTORIZAÇÃO",COR);let y=52;
      const t=(txt,sz,st,cor,esp,dx)=>{dx=dx||0;doc.setFont("helvetica",st||"normal");doc.setFontSize(sz);doc.setTextColor(...(cor||TINTA));const ls=doc.splitTextToSize(txt,CW-2*dx);doc.text(ls,M+dx,y);y+=ls.length*sz*.42+(esp||2.5);};
      const campo=(rot,w,x0)=>{doc.setFont("helvetica","bold");doc.setFontSize(8);doc.setTextColor(...CINZA);doc.text(rot.toUpperCase(),x0,y);doc.setDrawColor(...LINHA);doc.setLineWidth(.35);doc.line(x0,y+7.5,x0+w,y+7.5);};
      t("Para participação de criança ou adolescente (menor de 18 anos)",10,"italic",CINZA,5);
      campo("Nome do(a) responsável legal",CW,M);y+=12;campo("RG ou CPF do(a) responsável",(CW-6)/2,M);campo("Telefone para emergência",(CW-6)/2,M+(CW+6)/2);y+=12;
      campo("Nome do(a) participante",CW*.68,M);campo("Data de nascimento",CW*.28,M+CW*.72);y+=12;campo("Parentesco com o(a) participante",(CW-6)/2,M);campo("Problema de saúde, alergia ou remédio",(CW-6)/2,M+(CW+6)/2);y+=16;
      t(`Eu, responsável legal pelo(a) participante acima, AUTORIZO sua participação ${ativ}, do projeto “${p.nome}”, sob responsabilidade de ${resp}${o.local?", no local "+o.local:""}, em ${p.cidade}.`,10.5,"normal",TINTA,3.5);
      t("Declaro estar ciente de que a capoeira envolve atividade física, música e movimento, e que o(a) participante será acompanhado(a) pela equipe do projeto. Informarei à equipe qualquer condição de saúde que exija cuidado especial.",10.5,"normal",TINTA,3.5);
      t("Em caso de emergência, autorizo a equipe a tomar as providências necessárias e a entrar em contato pelo telefone informado acima.",10.5,"normal",TINTA,6);
      if(o.imagem){doc.setFillColor(246,248,247);doc.setDrawColor(...LINHA);doc.roundedRect(M,y-2,CW,31,2.5,2.5,"FD");y+=4;
        t("USO DE IMAGEM",9,"bold",COR,1.5,5);t("Autorizo o uso gratuito da imagem e da voz do(a) participante em fotos e vídeos do projeto, para divulgação cultural e prestação de contas, sem fins lucrativos.",9.5,"normal",TINTA,2.5,5);
        doc.setFont("helvetica","bold");doc.setFontSize(10.5);doc.setTextColor(...TINTA);doc.text("(     ) Autorizo          (     ) Não autorizo",M+5,y+1);y+=12;}
      y=Math.max(y+10,H-58);doc.setFont("helvetica","normal");doc.setFontSize(10.5);doc.setTextColor(...TINTA);doc.text(`${String(p.cidade||"").replace(/\s*-\s*[A-Z]{2}$/,"")}, ______ de ____________________ de ________.`,M,y);y+=24;
      doc.setDrawColor(...TINTA);doc.setLineWidth(.35);doc.line(M+30,y,W-M-30,y);doc.setFontSize(9);doc.setTextColor(...CINZA);doc.text("Assinatura do(a) responsável legal",W/2,y+5,{align:"center"});
      doc.setDrawColor(...LINHA);doc.line(M,H-10,W-M,H-10);doc.setFontSize(7.5);doc.text(doc.splitTextToSize(p.nome,CW-30)[0],M,H-6);if(o.copias>1)doc.text(`Cópia ${c+1} de ${o.copias}`,W-M,H-6,{align:"right"});}
    saveBlob(doc.output("blob"),"termo-de-autorizacao-"+fsafe(p.nome).slice(0,40)+".pdf");toast("file-text","Termo pronto",o.copias>1?o.copias+" cópias":"");}
  catch(e){console.error(e);toast("triangle-alert","Não deu para gerar o termo",(e&&e.message)||"");}}
/* ---------- 8: feriados estaduais e municipais ---------- */
const FER_UF={AC:[["01-23","Dia do Evangélico"],["06-15","Aniversário do Acre"],["09-05","Dia da Amazônia"],["11-17","Tratado de Petrópolis"]],AL:[["06-24","São João"],["06-29","São Pedro"],["09-16","Emancipação de Alagoas"]],
  AP:[["03-19","São José"],["09-13","Criação do Território do Amapá"]],AM:[["09-05","Elevação do Amazonas"],["12-08","Nossa Senhora da Conceição"]],BA:[["07-02","Independência da Bahia"]],CE:[["03-19","São José"],["03-25","Data Magna do Ceará"]],
  DF:[["11-30","Dia do Evangélico"]],MA:[["07-28","Adesão do Maranhão à Independência"]],MS:[["10-11","Criação do Mato Grosso do Sul"]],PA:[["08-15","Adesão do Pará à Independência"]],PB:[["08-05","Fundação da Paraíba"]],
  PE:[["03-06","Revolução Pernambucana"],["06-24","São João"]],PI:[["10-19","Dia do Piauí"]],PR:[["12-19","Emancipação do Paraná"]],RJ:[["04-23","São Jorge"]],RN:[["10-03","Mártires de Cunhaú e Uruaçu"]],
  RS:[["09-20","Revolução Farroupilha"]],RO:[["01-04","Criação de Rondônia"],["06-18","Dia do Evangélico"]],RR:[["10-05","Criação de Roraima"]],SP:[["07-09","Revolução Constitucionalista"]],SE:[["07-08","Emancipação de Sergipe"]],
  TO:[["03-18","Autonomia do Tocantins"],["09-08","Nossa Senhora da Natividade"],["10-05","Criação do Tocantins"]]};
const FER_MUN_PADRAO={fortaleza:[["04-13","Aniversário de Fortaleza"],["08-15","Nossa Senhora da Assunção"]]};
const FER_MUN={};const ufDe=c=>{const m=String(c||"").match(/[-\/,]\s*([A-Za-z]{2})\s*$/);return m?m[1].toUpperCase():"";};
async function carregarFeriadosCidade(p){if(!p||!p.cidadeKey||FER_MUN[p.cidadeKey])return;FER_MUN[p.cidadeKey]={lista:[]};try{const d=await B.get("feriados",p.cidadeKey);if(d)FER_MUN[p.cidadeKey]=d;rr();}catch(e){}}
function feriadoLocal(k){const p=P();if(!p)return"";const md=k.slice(5);const uf=(FER_UF[ufDe(p.cidade)]||[]).find(x=>x[0]===md);if(uf)return uf[1]+" (feriado estadual)";
  const ck=p.cidadeKey,mun=[...(FER_MUN_PADRAO[ck]||[]).map(([d,n])=>({d,n})),...(((FER_MUN[ck]||{}).lista)||[])];const m=mun.find(x=>x.d===md||x.d===k);if(m)return m.n+" (feriado municipal)";
  if(!FER_MUN[ck])carregarFeriadosCidade(p);return"";}
function feriadosCidadeForm(){const p=P();if(!p)return;const ck=p.cidadeKey,y=CAL?CAL.y:+TODAY().slice(0,4);const L=((FER_MUN[ck]||{}).lista||[]).slice();
  const desenha=()=>{const nac=Object.entries(feriadosDe(y)).sort(),uf=(FER_UF[ufDe(p.cidade)]||[]),pad=FER_MUN_PADRAO[ck]||[];
    $("fcL").innerHTML=`<p class="small"><b>Nacionais</b></p>${nac.map(([k,n])=>`<div class="frl"><span>${fdate(k).slice(0,5)}</span><span class="grow">${esc(n)}</span></div>`).join("")}
     <p class="small" style="margin-top:12px"><b>Estaduais (${ufDe(p.cidade)||"?"})</b></p>${uf.map(([d,n])=>`<div class="frl"><span>${d.slice(3)}/${d.slice(0,2)}</span><span class="grow">${esc(n)}</span></div>`).join("")||'<p class="tiny muted">Nenhum cadastrado.</p>'}
     <p class="small" style="margin-top:12px"><b>Municipais (${esc(p.cidade)})</b></p>${pad.map(([d,n])=>`<div class="frl"><span>${d.slice(3)}/${d.slice(0,2)}</span><span class="grow">${esc(n)}</span></div>`).join("")}
     ${L.map((f,i)=>`<div class="frl"><span>${f.d.length===5?f.d.slice(3)+"/"+f.d.slice(0,2):fdate(f.d)}</span><span class="grow">${esc(f.n)}</span><button class="ib" data-fr="${i}" aria-label="Tirar feriado" style="width:32px;height:32px">${ic("x")}</button></div>`).join("")||(pad.length?"":'<p class="tiny muted">Nenhum ainda. Adicione abaixo.</p>')}`;
    qa("[data-fr]").forEach(b=>b.onclick=async()=>{L.splice(+b.dataset.fr,1);await salvar();desenha();});};
  const salvar=async()=>{FER_MUN[ck]={lista:L,cidade:p.cidade};await B.set("feriados",ck,{lista:L,cidade:p.cidade,atualizado:Date.now(),por:UID});rr();};
  sheet(`<div class="grab"></div><h2>${ic("flag")} Feriados de ${esc(p.cidade)}</h2><p class="small muted" style="margin:0 0 8px">Os feriados aparecem em vermelho na agenda. Os municipais valem para todos os projetos desta cidade.</p>
  <div id="fcL"></div><div class="card" style="margin-top:12px"><b class="small">Adicionar feriado municipal</b>
   <div class="two"><label class="fld"><span>Dia</span><input id="fcD" type="date"></label><label class="fld"><span>Nome</span><input id="fcN" maxlength="60" placeholder="Ex.: Padroeira da cidade"></label></div>
   <label class="row small" style="font-weight:700"><input type="checkbox" id="fcA" checked style="width:20px;height:20px;accent-color:var(--mata)"> Repete todo ano</label>
   <button class="btn sm" id="fcS" style="margin-top:10px">${ic("plus")} Adicionar</button></div>`);
  desenha();$("fcS").onclick=async()=>{const d=$("fcD").value,n=$("fcN").value.trim();if(!d||!n)return toast("triangle-alert","Escolha o dia e escreva o nome","");L.push({d:$("fcA").checked?d.slice(5):d,n});$("fcD").value="";$("fcN").value="";await salvar();desenha();toast("flag","Feriado adicionado",n);};}
/* ---------- 9: lembrete da véspera e de hoje no Início ---------- */
function avisoVespera(p){const hj=TODAY(),am=addDays(hj,1),meus=new Set(meusProjetos().map(x=>x.id).concat(p?[p.id]:[]));
  const L=D.eventos.filter(e=>meus.has(e.projeto)&&(e.data===hj||e.data===am)).sort((a,b)=>(a.data+(a.hi||"")).localeCompare(b.data+(b.hi||"")));if(!L.length)return"";
  return L.map(e=>`<button class="vespera ${e.data===hj?"hoje":""}" data-e="${e.id}"><span class="vq">${e.data===hj?"HOJE":"AMANHÃ"}</span><span class="grow"><b>${esc(e.titulo)}</b><span class="small">${e.hi?"às "+e.hi:"dia todo"}${e.local?" · "+esc(e.local):""}${e.projeto!==(p&&p.id)?" · "+esc(e.projetoNome||""):""}</span></span>${ic("chevron-right","chev")}</button>`).join("");}
/* ---------- 10: sem internet ---------- */
let PEND=0,_teveP=false;
function marcaPendente(pr){PEND++;_teveP=true;redeUI();Promise.resolve(pr).catch(()=>{}).finally(()=>{PEND=Math.max(0,PEND-1);redeUI();});}
function redeUI(){let el=$("rede");if(!el){el=document.createElement("div");el.id="rede";el.setAttribute("role","status");document.body.appendChild(el);}
  const off=!navigator.onLine;if(off){el.className="rede off";el.innerHTML=`${ic("wifi-off")}<span><b>Sem internet.</b> Pode continuar usando: ${PEND?PEND+" item(ns) serão enviados":"tudo será enviado"} quando a internet voltar.</span>`;return;}
  if(PEND>0){el.className="rede env";el.innerHTML=`${ic("refresh-cw")}<span>Enviando ${PEND} item(ns)…</span>`;return;}
  el.className="rede hidden";if(_teveP){_teveP=false;toast("check","Tudo enviado","Os dados feitos sem internet já estão salvos na nuvem.");}}
window.addEventListener("online",()=>{redeUI();setTimeout(()=>{if(UID){filaRevisao();D.relatos.filter(r=>r.aEstimar).slice(0,3).forEach(r=>estimarPublico(r.id));}},3000);});
window.addEventListener("offline",redeUI);
